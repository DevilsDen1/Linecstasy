<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Linecstasy AI Chat</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4241323430911857"
         crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Hesap Oluştur</h2>
            <form id="registerForm" onsubmit="event.preventDefault(); handleRegister(event);">
                <div class="form-group">
                    <label for="name">Ad Soyad</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">E-posta</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Şifre Tekrar</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
                <button type="submit" class="auth-button">Kayıt Ol</button>
                <div class="auth-links">
                    <a href="login.html">Zaten hesabım var</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Core -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    
    <!-- Firebase Services -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    
    <!-- Uygulama Script'leri -->
    <script>
        // Firebase yüklendikten sonra diğer script'leri yükle
        function loadScripts() {
            const scripts = [
                'js/api-client.js',
                'js/auth.js'
            ];
            
            function loadScript(index) {
                if (index >= scripts.length) return;
                
                const script = document.createElement('script');
                script.src = scripts[index];
                script.onload = () => loadScript(index + 1);
                script.onerror = (e) => {
                    console.error(`Script yüklenemedi: ${scripts[index]}`, e);
                    loadScript(index + 1); // Bir sonraki script'i yüklemeye devam et
                };
                
                document.body.appendChild(script);
            }
            
            // İlk script'i yüklemeye başla
            loadScript(0);
        }
        
        // Tüm script'ler yüklendikten sonra çalıştır
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadScripts);
        } else {
            loadScripts();
        }
    </script>
    <script>
        // If already logged in, redirect to appropriate page
        document.addEventListener('DOMContentLoaded', function() {
            const currentUserData = localStorage.getItem('currentUser');
            if (currentUserData) {
                try {
                    const user = JSON.parse(currentUserData);
                    if (user.role === 'admin') {
                        window.location.replace('admin.html');
                    } else {
                        window.location.replace('index.html');
                    }
                } catch (e) {
                    console.error('Error parsing user data:', e);
                }
            }
        });
    </script>
</body>
</html>
